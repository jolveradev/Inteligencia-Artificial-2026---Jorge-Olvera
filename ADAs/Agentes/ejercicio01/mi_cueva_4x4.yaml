# Jorge Olvera Piña - LCC 2026
# MI CUEVA 4x4 Wumpus.
# (1, 1) is the bottom-left cave. The agent starts there, facing east.

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [4, 3]

pits:
  - [2, 2]
  - [4, 1]
  - [4, 4]

gold: [3, 4]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 200
